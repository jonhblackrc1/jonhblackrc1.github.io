<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0f3c;font-family:"Liberation Sans","DejaVu Sans",sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,#2b3aa8 0%,#141c6b 45%,#070a2e 100%)}
.beam{position:absolute;top:-200px;width:260px;height:2400px;background:linear-gradient(#ffffff30,#ffffff00 70%);transform-origin:50% 0;filter:blur(6px)}
.dot{position:absolute;border-radius:50%;background:#fff}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.band{position:absolute;left:0;right:0;bottom:0;height:150px;background:#d0021b;display:flex;align-items:center;overflow:hidden;border-top:8px solid #fff}
.band .live{background:#fff;color:#d0021b;font-weight:bold;font-size:44px;padding:14px 30px;margin-left:30px;border-radius:10px;z-index:2;white-space:nowrap}
.band .ticker{position:absolute;white-space:nowrap;font-size:48px;font-weight:bold;left:0}
h1{font-size:120px;line-height:1;font-weight:bold;letter-spacing:2px;text-shadow:0 8px 0 #d0021b,0 0 40px #0008}
h2{font-size:72px;font-weight:bold;text-shadow:0 5px 0 #0006}
.big{font-size:150px;font-weight:bold;color:#ffd400;text-shadow:0 8px 0 #b30018,0 0 50px #ffd40088;font-variant-numeric:tabular-nums}
.bar{width:860px;height:90px;border-radius:45px;background:#ffffff22;border:6px solid #fff;overflow:hidden;margin-top:50px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d0021b,#ff4d5e);border-radius:40px}
.chip{font-size:64px;font-weight:bold;background:#fff;color:#141c6b;padding:26px 50px;border-radius:70px;margin:22px;box-shadow:0 10px 0 #d0021b}
.heart{width:300px;height:300px}
</style></head><body>
<div id="stage">
 <div id="beams"></div><div id="dots"></div>

 <!-- 1: titulo -->
 <div class="scene" id="s1">
  <svg class="heart" id="h1" viewBox="0 0 100 100"><path d="M50 88 L12 50 A22 22 0 0 1 50 18 A22 22 0 0 1 88 50 Z" fill="#d0021b" stroke="#fff" stroke-width="4"/></svg>
  <h1 style="margin-top:40px">TELETÓN<br>FAMILIAR</h1>
  <h2 style="margin-top:50px;color:#ffd400">¡Rumbo a Guanaqueros!</h2>
 </div>

 <!-- 2: meta -->
 <div class="scene" id="s2">
  <h2>Nuestra meta es</h2>
  <div class="big" id="num" style="margin-top:30px">$0</div>
  <div class="bar"><i id="fill" style="width:0%"></i></div>
  <h2 style="margin-top:50px;font-size:60px;color:#ffd400">¡Para el viaje de fin de año!</h2>
 </div>

 <!-- 3: ideas -->
 <div class="scene" id="s3">
  <h1 style="font-size:110px">¡CADA LUCA<br>CUENTA!</h1>
  <div style="margin-top:60px;display:flex;flex-direction:column;align-items:center">
   <div class="chip" id="c1">Rifas</div>
   <div class="chip" id="c2">Completadas</div>
   <div class="chip" id="c3">Ventas y ahorro</div>
   <div class="chip" id="c4">La alcancía familiar</div>
  </div>
 </div>

 <!-- 4: guanaqueros -->
 <div class="scene" id="s4" style="justify-content:flex-start;padding-top:220px">
  <svg id="beach" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
   <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36a9ff"/><stop offset="1" stop-color="#bfe8ff"/></linearGradient></defs>
   <rect width="1080" height="1920" fill="url(#sky)"/>
   <circle id="sun" cx="820" cy="780" r="130" fill="#ffd400"/>
   <path d="M0 1080 Q200 960 420 1060 T820 1020 T1080 1060 V1920 H0Z" fill="#7a5a3a" opacity=".35"/>
   <rect y="1100" width="1080" height="400" fill="#0b6fc4"/>
   <path id="wave" fill="#2f95e6"/>
   <path d="M0 1380 Q540 1300 1080 1380 V1920 H0Z" fill="#f4d79a"/>
   <g transform="translate(250 1250)"><rect x="-6" y="0" width="12" height="330" fill="#fff" transform="rotate(-8)"/>
    <path d="M-200 30 Q0 -120 200 30 Z" fill="#d0021b" transform="rotate(-8)"/><path d="M-100 -15 Q0 -120 100 -15 Z" fill="#fff" opacity=".8" transform="rotate(-8)"/></g>
  </svg>
  <div style="position:relative">
   <h1 style="font-size:112px;text-shadow:0 8px 0 #0b4f8f">GUANAQUEROS</h1>
   <h2 style="margin-top:30px;color:#141c6b;text-shadow:none">Playa, sol y toda la familia</h2>
  </div>
 </div>

 <!-- 5: cierre -->
 <div class="scene" id="s5">
  <svg class="heart" id="h5" viewBox="0 0 100 100"><path d="M50 88 L12 50 A22 22 0 0 1 50 18 A22 22 0 0 1 88 50 Z" fill="#d0021b" stroke="#fff" stroke-width="4"/></svg>
  <h1 style="margin-top:40px;font-size:110px">¡VAMOS,<br>FAMILIA,<br>QUE SE PUEDE!</h1>
  <h2 style="margin-top:50px;color:#ffd400">Juntos llegamos a los<br>$4.266.000</h2>
 </div>

 <div class="band" id="band"><div class="ticker" id="ticker"></div><div class="live">EN VIVO</div></div>
</div>
<script>
const META=4266000, T=27;
const fmt=n=>'$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const beams=document.getElementById('beams'),dots=document.getElementById('dots');
const B=[];for(let i=0;i<5;i++){const b=document.createElement('div');b.className='beam';b.style.left=(i*230-40)+'px';beams.appendChild(b);B.push(b)}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const D=[];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='dot';const s=4+rnd()*10;d.style.width=d.style.height=s+'px';d.style.left=rnd()*1080+'px';d.style.top=rnd()*1700+'px';dots.appendChild(d);D.push({d,p:rnd()*6})}
const tk=document.getElementById('ticker');
tk.textContent=('TELETÓN FAMILIAR  ★  META: '+fmt(META)+'  ★  DESTINO: GUANAQUEROS  ★  ¡CADA APORTE SUMA!  ★  ').repeat(4);
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// scene windows [start,end]
const S={s1:[0,5],s2:[5,11.5],s3:[11.5,17.5],s4:[17.5,22.5],s5:[22.5,T+1]};
function vis(id,t){const[a,b]=S[id];const o=clamp((t-a)/0.4)*clamp((b-t)/0.4);const el=document.getElementById(id);el.style.opacity=o;return t-a}
window.render=function(t){
 B.forEach((b,i)=>b.style.transform=`rotate(${Math.sin(t*0.9+i*1.3)*22}deg)`);
 D.forEach(({d,p})=>d.style.opacity=0.2+0.6*Math.abs(Math.sin(t*2+p)));
 tk.style.transform=`translateX(${300-(t*160)%2600}px)`;
 // 1
 let l=vis('s1',t);
 document.getElementById('h1').style.transform=`scale(${back(l/0.8)*(1+0.06*Math.sin(l*7))})`;
 // 2
 l=vis('s2',t);const p=ease((l-0.5)/4);
 document.getElementById('num').textContent=fmt(META*p);
 document.getElementById('num').style.transform=`scale(${1+(p>=1?0.08*Math.max(0,Math.sin((l-4.5)*6))*clamp(1-(l-4.5)):0)})`;
 document.getElementById('fill').style.width=(p*100)+'%';
 // 3
 l=vis('s3',t);
 ['c1','c2','c3','c4'].forEach((id,i)=>{const k=back((l-0.6-i*0.45)/0.5);const e=document.getElementById(id);e.style.transform=`scale(${k}) rotate(${(i%2?2:-2)}deg)`;e.style.opacity=clamp((l-0.6-i*0.45)/0.2)});
 // 4
 l=vis('s4',t);
 document.getElementById('sun').setAttribute('r',130+8*Math.sin(l*3));
 let w='M0 1180';for(let x=0;x<=1080;x+=40)w+=` L${x} ${1170+18*Math.sin(x/90+l*3)}`;w+=' L1080 1500 L0 1500Z';
 document.getElementById('wave').setAttribute('d',w);
 document.getElementById('band').style.opacity=1-clamp((t-17.5)/0.4)+clamp((t-22.5)/0.4);
 // 5
 l=vis('s5',t);
 document.getElementById('h5').style.transform=`scale(${back(l/0.8)*(1+0.08*Math.sin(l*7))})`;
 document.getElementById('stage').style.opacity=1-clamp((t-(T-0.8))/0.8);
};
render(0);
</script></body></html>
