name: Pirámide Android

on:
  push:
    paths:
      - 'piramide/app/**'
      - 'piramide/android/**'
      - '.github/workflows/piramide-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piramide/android
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
      PIRAMIDE_SUB_ID: ${{ vars.PIRAMIDE_SUB_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Copiar el juego a los assets
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets
          cp -r ../app app/src/main/assets/www

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.PIRAMIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PIRAMIDE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin el secreto PIRAMIDE_KEYSTORE_BASE64 el AAB sale sin firmar y Play Store no lo aceptará."
          fi

      - name: Compilar AAB y APK
        env:
          PIRAMIDE_KEYSTORE_PASSWORD: ${{ secrets.PIRAMIDE_KEYSTORE_PASSWORD }}
          PIRAMIDE_KEY_ALIAS: ${{ secrets.PIRAMIDE_KEY_ALIAS }}
          PIRAMIDE_KEY_PASSWORD: ${{ secrets.PIRAMIDE_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: piramide-play-store
          path: |
            piramide/android/app/build/outputs/bundle/release/*.aab
            piramide/android/app/build/outputs/apk/release/*.apk
            piramide/android/app/build/outputs/apk/debug/*.apk
